dataset:
  name: stl10
  data_root: assets
  num_workers: 4
  download: false

model:
  feature_dim: 128

optimizer:
  name: adam
  lr: 0.0005
  weight_decay: 0.000001
  warmup_epochs: 5

runtime:
  batch_size: 128
  epochs: 100
  seed: 42
  device: auto

loss:
  temperature: 0.5
  hard_ratio: 0.25
  reg_form: square
  reg_weight: 0.0

eval:
  knn_k: 200

logging:
  output_dir: runs
  use_wandb: true
  run_name: stl10_baseline
